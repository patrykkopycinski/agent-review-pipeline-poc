name: AI Code Review

# Runs the code-review agent on every PR opened / updated and posts the review
# back to the PR conversation as a comment.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agent-review:
    name: agent-review (OpenRouter)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The review agent: scripts/ai-review.mjs sends the PR diff + prompts/code-review.md
      # to OpenRouter and posts the result as a PR comment via gh (GITHUB_TOKEN).
      - name: Run the review agent and post the PR comment
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/ai-review.mjs "$PR_NUMBER"
